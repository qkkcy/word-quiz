<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>오늘의 영단어</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f5f4f0;color:#1a1a18;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.wrap{max-width:480px;margin:0 auto;padding:18px 20px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.count{font-size:13px;color:#6b6a64;}
.sync-status{font-size:11px;color:#9a988f;margin-top:2px;}
button{font-family:inherit;font-size:14px;background:#fff;border:1px solid #d8d6cd;border-radius:8px;padding:8px 14px;cursor:pointer;color:#1a1a18;}
button:active{opacity:0.7;}
.primary{background:#1a1a18;color:#fff;border:none;width:100%;padding:14px;font-size:15px;border-radius:10px;margin-top:10px;}
.secondary{background:#fff;color:#1a1a18;border:1px solid #d8d6cd;width:100%;padding:12px;font-size:14px;border-radius:10px;margin-top:8px;}

/* 통계 바 */
.stat-row{display:flex;gap:6px;margin-bottom:12px;}
.stat-box{flex:1;background:#fff;border:1px solid #e3e1d8;border-radius:10px;padding:8px 6px;text-align:center;}
.stat-num{font-size:18px;font-weight:600;margin:0;}
.stat-label{font-size:10px;color:#9a988f;margin:2px 0 0;}

/* 진행바 */
.progress-wrap{margin-bottom:12px;}
.progress-bar{height:4px;background:#e3e1d8;border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;transition:width 0.3s;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:#9a988f;margin-top:4px;}

/* 뱃지 */
.badge{display:inline-block;border-radius:6px;font-size:10px;padding:2px 6px;margin-left:5px;vertical-align:middle;font-weight:600;}
.badge-danger{background:#fff0f0;border:1px solid #e07070;color:#9a2a2a;}
.badge-review{background:#fff8e0;border:1px solid #d4a020;color:#7a5010;}
.badge-normal{background:#f0f5ff;border:1px solid #6090d0;color:#1a4080;}
.badge-master{background:#f0fff0;border:1px solid #50a050;color:#1a6020;}

/* 카드 */
.card{background:#fff;border:1px solid #e3e1d8;border-radius:16px;padding:30px 24px 22px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;}
.card:active{background:#f9f8f4;}
.card-word{font-size:28px;font-weight:600;margin:0 0 4px;}
.card-pron{font-size:15px;color:#7a8a6a;margin:0 0 12px;font-style:italic;display:none;}
.card-example{font-size:14px;color:#4f4e48;margin:0;line-height:1.6;display:none;background:#f5f4f0;border-radius:8px;padding:10px 12px;width:100%;text-align:left;}
.card-divider{width:40px;height:1px;background:#e3e1d8;margin:12px auto;display:none;}
.card-meaning{font-size:18px;color:#1a1a18;margin:0;font-weight:500;display:none;line-height:1.5;}
.card-hint{font-size:12px;color:#9a988f;margin-top:14px;}
.steps{display:flex;gap:6px;margin-top:10px;justify-content:center;}
.step-dot{width:6px;height:6px;border-radius:50%;background:#d8d6cd;transition:background 0.2s;}
.step-dot.active{background:#1a1a18;}

/* OX */
.ox-row{display:flex;gap:10px;margin-top:12px;}
.btn-x{flex:1;padding:14px;font-size:22px;border-radius:12px;background:#fff5f5;border:1.5px solid #e07070;color:#9a2a2a;}
.btn-o{flex:1;padding:14px;font-size:22px;border-radius:12px;background:#f0faf0;border:1.5px solid #7bc47b;color:#2a7a2a;}
.btn-x:active{background:#fde8e8;}
.btn-o:active{background:#d8f5d8;}
.ox-label{display:flex;justify-content:space-between;font-size:11px;color:#9a988f;margin-top:4px;padding:0 4px;}

/* 완료 */
.done-card{background:#fff;border:1px solid #e3e1d8;border-radius:16px;padding:36px 24px;text-align:center;}
.done-card h3{font-size:22px;margin:0 0 8px;}
.done-card p{font-size:14px;color:#6b6a64;margin:0 0 6px;}

/* 통계 화면 */
.view{display:none;}
.view.active{display:block;}
textarea,input[type=text]{width:100%;font-family:inherit;font-size:14px;padding:10px;border-radius:8px;border:1px solid #d8d6cd;background:#fff;color:#1a1a18;margin-bottom:8px;}
textarea{resize:vertical;}
.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tabs button{flex:1;}
.tabs button.active{background:#1a1a18;color:#fff;border-color:#1a1a18;}
.list-row{display:flex;justify-content:space-between;align-items:center;border:1px solid #e3e1d8;border-radius:8px;padding:10px 12px;margin-bottom:6px;background:#fff;}
.list-row .w{font-weight:600;font-size:14px;}
.list-row .m{font-size:13px;color:#6b6a64;margin-left:6px;}
.list-row .del{border:none;background:none;color:#b94a3a;font-size:13px;padding:4px 8px;flex-shrink:0;}
.result{font-size:12px;color:#6b6a64;margin:4px 0 14px;}
h2{font-size:16px;margin:0 0 14px;}
.info-box{background:#f0f0ea;border-radius:8px;padding:10px 12px;font-size:12px;color:#6b6a64;margin-bottom:14px;line-height:1.6;}
.section-label{font-size:12px;color:#9a988f;margin:12px 0 6px;}

/* 통계 탭 */
.stat-list-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #f0ede8;font-size:13px;}
.stat-list-row:last-child{border-bottom:none;}
.stat-list-wrap{background:#fff;border:1px solid #e3e1d8;border-radius:10px;overflow:hidden;margin-bottom:12px;}
</style>
</head>
<body>
<div class="wrap">

<!-- 퀴즈 뷰 -->
<div id="quizView" class="view active">
  <div class="topbar">
    <div>
      <div class="count" id="countLabel">불러오는 중...</div>
      <div class="sync-status" id="syncStatus"></div>
    </div>
    <div style="display:flex;gap:6px;">
      <button id="statsBtn">통계</button>
      <button id="manageBtn">관리</button>
    </div>
  </div>

  <!-- 4단계 통계 바 -->
  <div class="stat-row">
    <div class="stat-box">
      <p class="stat-num" id="sNum0" style="color:#c03030;">0</p>
      <p class="stat-label">🔴 위험</p>
    </div>
    <div class="stat-box">
      <p class="stat-num" id="sNum1" style="color:#b07010;">0</p>
      <p class="stat-label">🟡 복습</p>
    </div>
    <div class="stat-box">
      <p class="stat-num" id="sNum2" style="color:#2060b0;">0</p>
      <p class="stat-label">🟢 일반</p>
    </div>
    <div class="stat-box">
      <p class="stat-num" id="sNum3" style="color:#208020;">0</p>
      <p class="stat-label">⭐ 마스터</p>
    </div>
  </div>

  <!-- 진행바 -->
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;background:#1a1a18;"></div></div>
    <div class="progress-label">
      <span id="progressLeft">남은 0개</span>
      <span id="progressRight">✓ 0개</span>
    </div>
  </div>

  <!-- 카드 -->
  <div id="cardWrap">
    <div class="card" id="card">
      <p class="card-word" id="cardWord">...</p>
      <p class="card-pron" id="cardPron"></p>
      <div class="card-example" id="cardExample"></div>
      <div class="card-divider" id="cardDivider"></div>
      <p class="card-meaning" id="cardMeaning"></p>
      <p class="card-hint" id="cardHint">탭해서 보기</p>
      <div class="steps">
        <div class="step-dot active" id="dot0"></div>
        <div class="step-dot" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
      </div>
    </div>
    <div class="ox-row" id="oxRow" style="display:none;">
      <button class="btn-x" id="btnX">✕</button>
      <button class="btn-o" id="btnO">○</button>
    </div>
    <div class="ox-label" id="oxLabel" style="display:none;">
      <span>다시 볼게요</span>
      <span>외웠어요</span>
    </div>
  </div>

  <!-- 완료 -->
  <div id="doneCard" class="done-card" style="display:none;">
    <h3>🎉 세션 완료!</h3>
    <p id="doneMsg"></p>
    <p id="doneSub" style="font-size:12px;color:#9a988f;"></p>
    <button class="primary" id="restartBtn">처음부터 다시</button>
    <button class="secondary" id="reviewWeakBtn">위험/복습만 다시</button>
  </div>

  <button class="secondary" id="syncBtn" style="margin-top:10px;">🔄 구글 시트에서 새로고침</button>
</div>

<!-- 통계 뷰 -->
<div id="statsView" class="view">
  <div class="topbar">
    <h2>단어 통계</h2>
    <button id="statsBackBtn">퀴즈로</button>
  </div>
  <div class="tabs">
    <button id="tabDanger" class="active">🔴 위험</button>
    <button id="tabReview">🟡 복습</button>
    <button id="tabMaster">⭐ 마스터</button>
  </div>
  <div id="statsList"></div>
</div>

<!-- 관리 뷰 -->
<div id="manageView" class="view">
  <div class="topbar">
    <h2>단어 관리</h2>
    <button id="backBtn">퀴즈로</button>
  </div>
  <div class="info-box">📋 구글 시트: <b>A단어 · B발음기호 · C예시 · D뜻</b></div>
  <div class="tabs">
    <button id="tabSingle" class="active">한 개씩</button>
    <button id="tabBulk">한꺼번에</button>
  </div>
  <div id="singleAdd">
    <input id="wordInput" type="text" placeholder="단어"/>
    <input id="pronInput" type="text" placeholder="발음기호 — 선택"/>
    <input id="exampleInput" type="text" placeholder="예시 문장 — 선택"/>
    <input id="meaningInput" type="text" placeholder="뜻"/>
    <button class="primary" id="addBtn">추가</button>
  </div>
  <div id="bulkAdd" style="display:none;">
    <p style="font-size:12px;color:#9a988f;margin:0 0 6px;">탭(Tab)으로 구분: 단어[탭]발음기호[탭]예시[탭]뜻</p>
    <textarea id="bulkInput" rows="6"></textarea>
    <button class="primary" id="bulkAddBtn">일괄 추가</button>
    <p class="result" id="bulkResult"></p>
  </div>
  <div id="wordList" style="margin-top:18px;"></div>
</div>

</div><!-- /wrap -->
<script>
var SHEET_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSE__0bUpaRs8kyyHFbhV8DI-oANK6QLHh9ozWcFLXyfNl6OiMxdfzKe5ByH4KTjPj7sRoieTw8Ur2K/pub?gid=0&single=true&output=csv';
var LOCAL_KEY='wordquiz-local-v2';
var SHEET_KEY='wordquiz-sheet-v2';
var STATS_KEY='wordquiz-stats-v1'; // {word: {o:n, x:n, seen:n}}

var sheetWords=[],localWords=[],allWords=[];
var wordStats={}; // 영구 통계

// 세션 상태
var queue=[], sessionX=[], oCount=0, currentWord=null, step=0;

/* ── 스토리지 ── */
function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');}catch(e){return[];}}
function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(localWords));}
function loadCachedSheet(){try{return JSON.parse(localStorage.getItem(SHEET_KEY)||'[]');}catch(e){return[];}}
function saveCachedSheet(w){localStorage.setItem(SHEET_KEY,JSON.stringify(w));}
function loadStats(){try{return JSON.parse(localStorage.getItem(STATS_KEY)||'{}');}catch(e){return {};}}
function saveStats(){localStorage.setItem(STATS_KEY,JSON.stringify(wordStats));}
function mergeWords(){allWords=sheetWords.concat(localWords);}

/* ── 단어 분류 ── */
// 0=위험, 1=복습, 2=일반, 3=마스터
function classify(w){
  var s=wordStats[w.word]||{o:0,x:0,seen:0};
  var total=s.o+s.x;
  if(s.o>=5 && (total===0||s.x/total<0.2)) return 3; // 마스터
  if(total===0||s.seen<3) return 1; // 복습(미접촉)
  var xRate=s.x/total;
  if(xRate>0.5) return 0; // 위험
  if(xRate>=0.2) return 1; // 복습
  return 2; // 일반
}

function getCounts(){
  var c=[0,0,0,0];
  allWords.forEach(function(w){c[classify(w)]++;});
  return c;
}

/* ── 셔플 ── */
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

/* ── 세션 시작 ── */
// 빈도: 위험 3x, 복습 2x, 일반 1x, 마스터: 매 3세션마다 1x
var sessionCount=0;
function startSession(weakOnly){
  sessionCount++;
  var groups=[[],[],[],[]];
  allWords.forEach(function(w){groups[classify(w)].push(w);});

  var q=[];
  // 위험 3회
  for(var i=0;i<3;i++) q=q.concat(shuffle(groups[0]));
  // 복습 2회
  for(var i=0;i<2;i++) q=q.concat(shuffle(groups[1]));
  // 일반 1회
  q=q.concat(shuffle(groups[2]));
  // 마스터: 3세션마다 1회 출제
  if(!weakOnly && sessionCount%3===0) q=q.concat(shuffle(groups[3]));

  if(weakOnly){
    q=[];
    for(var i=0;i<3;i++) q=q.concat(shuffle(groups[0]));
    for(var i=0;i<2;i++) q=q.concat(shuffle(groups[1]));
  }

  if(q.length===0) q=shuffle(allWords.slice());

  queue=q; sessionX=[]; oCount=0;
  document.getElementById('doneCard').style.display='none';
  document.getElementById('cardWrap').style.display='block';
  updateStatBoxes();
  showCard();
}

/* ── 카드 흐름 ── */
function showCard(){
  if(queue.length===0 && sessionX.length>0){
    queue=shuffle(sessionX.slice()); sessionX=[];
  }
  if(queue.length===0){showDone();return;}
  currentWord=queue.shift();
  step=0;
  renderCard();
  updateProgress();
  document.getElementById('oxRow').style.display='none';
  document.getElementById('oxLabel').style.display='none';
}

function markO(){
  var s=getOrCreateStat(currentWord.word);
  s.o++; s.seen++;
  saveStats();
  oCount++;
  updateStatBoxes();
  showCard();
}

function markX(){
  var s=getOrCreateStat(currentWord.word);
  s.x++; s.seen++;
  saveStats();
  sessionX.push(currentWord);
  updateStatBoxes();
  showCard();
}

function getOrCreateStat(word){
  if(!wordStats[word]) wordStats[word]={o:0,x:0,seen:0};
  return wordStats[word];
}

function showDone(){
  document.getElementById('cardWrap').style.display='none';
  document.getElementById('doneCard').style.display='block';
  var c=getCounts();
  document.getElementById('doneMsg').textContent='이번 세션 ✓ '+oCount+'개 완료';
  document.getElementById('doneSub').textContent='위험 '+c[0]+'개 · 복습 '+c[1]+'개 · 일반 '+c[2]+'개 · 마스터 '+c[3]+'개';
  updateStatBoxes();
  updateProgress();
}

/* ── 렌더 ── */
function renderCard(){
  var w=currentWord;
  var cls=classify(w);
  var badgeMap=['위험','복습','','⭐마스터'];
  var badgeClass=['badge-danger','badge-review','','badge-master'];
  var wordEl=document.getElementById('cardWord');
  wordEl.textContent=w.word;
  // 뱃지
  var old=document.getElementById('wordBadge');
  if(old)old.remove();
  if(cls!==2){
    var b=document.createElement('span');
    b.id='wordBadge';b.className='badge '+badgeClass[cls];
    b.textContent=badgeMap[cls];
    wordEl.appendChild(b);
  }
  // 통계 소힌트
  var s=wordStats[w.word]||{o:0,x:0,seen:0};
  var statHint=s.seen>0?'○'+s.o+' ✕'+s.x:'첫 등장';

  document.getElementById('cardPron').textContent=w.pron||'';
  document.getElementById('cardPron').style.display='none';
  document.getElementById('cardExample').textContent=w.example||'';
  document.getElementById('cardExample').style.display='none';
  document.getElementById('cardDivider').style.display='none';
  document.getElementById('cardMeaning').textContent=w.meaning;
  document.getElementById('cardMeaning').style.display='none';
  var hasPE=w.pron||w.example;
  document.getElementById('cardHint').textContent=(hasPE?'탭해서 발음 · 예시 보기':'탭해서 뜻 보기')+' · '+statHint;
  setDots(0);
}

function tapCard(){
  if(!currentWord)return;
  var w=currentWord,hasPE=w.pron||w.example;
  if(!hasPE){
    if(step===0){
      document.getElementById('cardMeaning').style.display='block';
      document.getElementById('cardDivider').style.display='block';
      document.getElementById('cardHint').textContent='알면 ○, 모르면 ✕';
      step=1;setDots(1);showOX();
    }
    return;
  }
  if(step===0){
    if(w.pron)document.getElementById('cardPron').style.display='block';
    if(w.example)document.getElementById('cardExample').style.display='block';
    document.getElementById('cardHint').textContent='탭해서 뜻 보기';
    step=1;setDots(1);
  } else if(step===1){
    document.getElementById('cardDivider').style.display='block';
    document.getElementById('cardMeaning').style.display='block';
    document.getElementById('cardHint').textContent='알면 ○, 모르면 ✕';
    step=2;setDots(2);showOX();
  }
}

function showOX(){
  document.getElementById('oxRow').style.display='flex';
  document.getElementById('oxLabel').style.display='flex';
}

function updateStatBoxes(){
  var c=getCounts();
  document.getElementById('sNum0').textContent=c[0];
  document.getElementById('sNum1').textContent=c[1];
  document.getElementById('sNum2').textContent=c[2];
  document.getElementById('sNum3').textContent=c[3];
  document.getElementById('countLabel').textContent='총 '+allWords.length+'개';
}

function updateProgress(){
  var total=queue.length+(currentWord?1:0)+sessionX.length+oCount;
  if(total===0)return;
  var pct=Math.round((oCount/total)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  var rem=queue.length+(currentWord?1:0)+sessionX.length;
  document.getElementById('progressLeft').textContent='남은 '+rem+'개';
  document.getElementById('progressRight').textContent='✓ '+oCount+'개';
}

function setDots(s){for(var i=0;i<3;i++)document.getElementById('dot'+i).className='step-dot'+(i===s?' active':'');}

/* ── 통계 화면 ── */
var statsTab=0;
function renderStatsList(tab){
  statsTab=tab;
  ['tabDanger','tabReview','tabMaster'].forEach(function(id,i){
    document.getElementById(id).classList.toggle('active',i===tab);
  });
  var targetCls=[0,1,3][tab];
  var list=document.getElementById('statsList');
  list.innerHTML='';
  var words=allWords.filter(function(w){return classify(w)===targetCls;});
  if(words.length===0){
    list.innerHTML='<p style="font-size:13px;color:#9a988f;text-align:center;padding:2rem 0;">해당 단어가 없어요.</p>';
    return;
  }
  // 위험/복습은 X 많은 순 정렬
  words.sort(function(a,b){
    var sa=wordStats[a.word]||{o:0,x:0};
    var sb=wordStats[b.word]||{o:0,x:0};
    return (sb.x-sb.o)-(sa.x-sa.o);
  });
  var wrap=document.createElement('div');
  wrap.className='stat-list-wrap';
  words.forEach(function(w){
    var s=wordStats[w.word]||{o:0,x:0,seen:0};
    var row=document.createElement('div');
    row.className='stat-list-row';
    row.innerHTML='<div style="flex:1"><span style="font-weight:600;font-size:14px;">'+escapeHtml(w.word)+'</span><span style="font-size:12px;color:#6b6a64;margin-left:6px;">'+escapeHtml(w.meaning)+'</span></div>'
      +'<div style="font-size:12px;color:#9a988f;white-space:nowrap;margin-left:8px;">○'+s.o+' ✕'+s.x+'</div>';
    wrap.appendChild(row);
  });
  list.appendChild(wrap);
}

/* ── CSV ── */
function parseCSVLine(line){
  var result=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(c===','&&!inQ){result.push(cur.trim());cur='';}
    else{cur+=c;}
  }
  result.push(cur.trim());return result;
}
function parseCSV(text){
  var lines=text.trim().split('\n'),result=[];
  for(var i=1;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var cols=parseCSVLine(line);
    var word=cols[0]||'',pron='',example='',meaning='';
    if(cols.length>=4){pron=cols[1]||'';example=cols[2]||'';meaning=cols[3]||'';}
    else{meaning=cols[1]||'';}
    if(word&&meaning)result.push({word:word,pron:pron,example:example,meaning:meaning});
  }
  return result;
}
function fetchSheet(cb){
  document.getElementById('syncStatus').textContent='동기화 중...';
  fetch(SHEET_CSV_URL)
    .then(function(r){if(!r.ok)throw new Error();return r.text();})
    .then(function(text){
      var parsed=parseCSV(text);
      if(parsed.length>0){
        sheetWords=parsed;saveCachedSheet(sheetWords);mergeWords();
        updateStatBoxes();renderList();
        var t=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
        document.getElementById('syncStatus').textContent='✓ 동기화 '+t;
        if(cb)cb();
      }else{document.getElementById('syncStatus').textContent='⚠️ 단어를 찾지 못했어요';}
    })
    .catch(function(){
      document.getElementById('syncStatus').textContent='⚠️ 오프라인';
      if(cb)cb();
    });
}

/* ── 초기화 ── */
function init(){
  localWords=loadLocal();sheetWords=loadCachedSheet();wordStats=loadStats();mergeWords();
  updateStatBoxes();renderList();startSession(false);fetchSheet(null);
}

function escapeHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function renderList(){
  var list=document.getElementById('wordList');list.innerHTML='';
  if(localWords.length>0){
    var h=document.createElement('p');h.className='section-label';h.textContent='📱 직접 추가 ('+localWords.length+'개)';list.appendChild(h);
    localWords.slice().reverse().forEach(function(w,ri){
      var idx=localWords.length-1-ri;
      var row=document.createElement('div');row.className='list-row';
      var td=document.createElement('div');td.style.flex='1';
      td.innerHTML='<span class="w">'+escapeHtml(w.word)+'</span><span class="m">'+escapeHtml(w.meaning)+'</span>';
      var db=document.createElement('button');db.className='del';db.textContent='삭제';
      db.addEventListener('click',(function(i){return function(){localWords.splice(i,1);saveLocal();mergeWords();updateStatBoxes();renderList();};})(idx));
      row.appendChild(td);row.appendChild(db);list.appendChild(row);
    });
  }
  if(sheetWords.length>0){
    var h2=document.createElement('p');h2.className='section-label';h2.style.marginTop='12px';h2.textContent='📋 구글 시트 ('+sheetWords.length+'개)';list.appendChild(h2);
    sheetWords.slice(0,30).forEach(function(w){
      var row=document.createElement('div');row.className='list-row';
      row.innerHTML='<div style="flex:1"><span class="w">'+escapeHtml(w.word)+'</span><span class="m">'+escapeHtml(w.meaning)+'</span></div>';
      list.appendChild(row);
    });
    if(sheetWords.length>30){var more=document.createElement('p');more.style.cssText='font-size:12px;color:#9a988f;text-align:center;padding:8px 0;';more.textContent='... 외 '+(sheetWords.length-30)+'개';list.appendChild(more);}
  }
}

/* ── 이벤트 ── */
document.getElementById('card').addEventListener('click',tapCard);
document.getElementById('btnO').addEventListener('click',markO);
document.getElementById('btnX').addEventListener('click',markX);
document.getElementById('restartBtn').addEventListener('click',function(){startSession(false);});
document.getElementById('reviewWeakBtn').addEventListener('click',function(){startSession(true);});
document.getElementById('syncBtn').addEventListener('click',function(){fetchSheet(function(){startSession(false);});});

document.getElementById('statsBtn').addEventListener('click',function(){
  renderStatsList(0);
  document.getElementById('quizView').classList.remove('active');
  document.getElementById('statsView').classList.add('active');
});
document.getElementById('statsBackBtn').addEventListener('click',function(){
  document.getElementById('statsView').classList.remove('active');
  document.getElementById('quizView').classList.add('active');
});
document.getElementById('tabDanger').addEventListener('click',function(){renderStatsList(0);});
document.getElementById('tabReview').addEventListener('click',function(){renderStatsList(1);});
document.getElementById('tabMaster').addEventListener('click',function(){renderStatsList(2);});

document.getElementById('manageBtn').addEventListener('click',function(){
  document.getElementById('quizView').classList.remove('active');
  document.getElementById('manageView').classList.add('active');
});
document.getElementById('backBtn').addEventListener('click',function(){
  document.getElementById('manageView').classList.remove('active');
  document.getElementById('quizView').classList.add('active');
});
document.getElementById('tabSingle').addEventListener('click',function(){
  document.getElementById('singleAdd').style.display='block';document.getElementById('bulkAdd').style.display='none';
  this.classList.add('active');document.getElementById('tabBulk').classList.remove('active');
});
document.getElementById('tabBulk').addEventListener('click',function(){
  document.getElementById('singleAdd').style.display='none';document.getElementById('bulkAdd').style.display='block';
  this.classList.add('active');document.getElementById('tabSingle').classList.remove('active');
});
document.getElementById('addBtn').addEventListener('click',function(){
  var w=document.getElementById('wordInput').value.trim(),p=document.getElementById('pronInput').value.trim(),e=document.getElementById('exampleInput').value.trim(),m=document.getElementById('meaningInput').value.trim();
  if(!w||!m)return;
  localWords.push({word:w,pron:p,example:e,meaning:m});saveLocal();mergeWords();
  ['wordInput','pronInput','exampleInput','meaningInput'].forEach(function(id){document.getElementById(id).value='';});
  updateStatBoxes();renderList();
});
document.getElementById('bulkAddBtn').addEventListener('click',function(){
  var lines=document.getElementById('bulkInput').value.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var added=0,skipped=0;
  lines.forEach(function(line){
    var cols=line.split('\t');
    if(cols.length>=4){var w=cols[0].trim(),p=cols[1].trim(),e=cols[2].trim(),m=cols[3].trim();if(w&&m){localWords.push({word:w,pron:p,example:e,meaning:m});added++;}else skipped++;}
    else if(cols.length===2){var w2=cols[0].trim(),m2=cols[1].trim();if(w2&&m2){localWords.push({word:w2,pron:'',example:'',meaning:m2});added++;}else skipped++;}
    else skipped++;
  });
  saveLocal();mergeWords();document.getElementById('bulkInput').value='';
  updateStatBoxes();renderList();
  document.getElementById('bulkResult').textContent=added+'개 추가됨'+(skipped>0?', '+skipped+'개 건너뜀':'');
});

init();
</script>
